name: ShieldML CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run Ruff Linting
        run: |
          ruff check src/ app/ scripts/ tests/

      - name: Run Automated Pytest Suite
        run: |
          python -m pytest tests/ --junitxml=junit.xml

      - name: Execute Model Training Pipeline Smoke Test
        run: |
          python scripts/train.py

      - name: Verify Champion Artifacts
        run: |
          test -f artifacts/models/champion_model.joblib
          test -f artifacts/models/feature_pipeline.joblib
          test -f artifacts/models/champion_metadata.json
